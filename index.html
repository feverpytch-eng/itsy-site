  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ght:160px;object-fit:cover;display:block\"><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px\">\n          <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.16em\">GUIDERAMA<\u002Fspan>\n          <span style=\"font-family:'Space Mono',monospace;font-weight:700;font-size:8.5px;letter-spacing:0.12em;padding:2px 6px;border:1.5px solid #1E39D4;color:#1E39D4;transform:rotate(-2deg)\">LIVE<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:absolute;top:544px;left:14px;right:14px;text-align:center;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.18em;color:#8A887F\">SHIPPED, FOR REAL ↓ RECEIPTS BELOW<\u002Fdiv>\n          <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Three ways in\" data-reveal=\"true\" style=\"opacity:1\">\n    <div style=\"border-top:3px solid #111110;padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\">\n      <h2 style=\"margin:0;font-weight:900;font-stretch:118%;font-size:clamp(24px,3.6vw,34px);letter-spacing:-0.02em;text-transform:uppercase\">Four ways in<\u002Fh2>\n      <span style=\"font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.2em;color:#8A887F\">SELECT ONE<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"color:#3E3D39;font-size:15px;max-width:60ch;margin:12px 0 30px\">Different starting points, same pipeline. Every project gets defined, capped, built, and handed over. If you're in a rush, even better. That's our favorite kind of client.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));border:2px solid #111110;background:#fff\">\n      <div style=\"display:flex;flex-direction:column;padding:20px 20px 22px;border-right:1px solid #111110;min-width:0\" style-hover=\"background:#FAFAF7\">\n        <span style=\"font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#1E39D4;font-weight:700\">THE PRODUCT<\u002Fspan>\n        <h3 style=\"margin:10px 0 0;font-weight:900;font-stretch:112%;font-size:clamp(19px,2.4vw,23px);letter-spacing:-0.015em;text-transform:uppercase\">Ship it<\u002Fh3>\n        <p style=\"font-size:14px;color:#111110;font-weight:600;margin:10px 0 0\">You have an idea for a digital product. You’re not technical, or you’re too busy to build it.<\u002Fp>\n        <p style=\"font-size:14px;color:#3E3D39;margin:8px 0 18px\">We define it quickly, then rapid-build to a working prototype or MVP, whichever we decide the idea deserves. You see something real in weeks, not quarters.<\u002Fp>\n        <span style=\"margin-top:auto;align-self:flex-start;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#111110;border:1.5px solid #111110;padding:7px 10px\">→ PROTOTYPE OR MVP, LIVE<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;padding:20px 20px 22px;border-right:1px solid #111110;min-width:0\" style-hover=\"background:#FAFAF7\">\n        <span style=\"font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#1E39D4;font-weight:700\">THE VENTURE<\u002Fspan>\n        <h3 style=\"margin:10px 0 0;font-weight:900;font-stretch:112%;font-size:clamp(19px,2.4vw,23px);letter-spacing:-0.015em;text-transform:uppercase\">Launch the business<\u002Fh3>\n        <p style=\"font-size:14px;color:#111110;font-weight:600;margin:10px 0 0\">You have a business idea or project that needs to exist in the world, not just on paper.<\u002Fp>\n        <p style=\"font-size:14px;color:#3E3D39;margin:8px 0 18px\">Due diligence, competitive read, strategy, then actual execution to launch. Logistics, comms, branding, landing pages. We’re doing this right now for a team launching a new annual event.<\u002Fp>\n        <span style=\"margin-top:auto;align-self:flex-start;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#111110;border:1.5px solid #111110;padding:7px 10px\">→ A LAUNCHED VENTURE<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;padding:20px 20px 22px;border-right:1px solid #111110;min-width:0\" style-hover=\"background:#FAFAF7\">\n        <span style=\"font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#1E39D4;font-weight:700\">THE SOLUTION<\u002Fspan>\n        <h3 style=\"margin:10px 0 0;font-weight:900;font-stretch:112%;font-size:clamp(19px,2.4vw,23px);letter-spacing:-0.015em;text-transform:uppercase\">Fix the flow<\u002Fh3>\n        <p style=\"font-size:14px;color:#111110;font-weight:600;margin:10px 0 0\">You run a small business or a creative practice, and the way you work is costing you.<\u002Fp>\n        <p style=\"font-size:14px;color:#3E3D39;margin:8px 0 18px\">A capped optimization sprint. We find where AI and better systems actually help, build the fix, hand it over working, and leave you running faster. No ongoing dependency, no retainer.<\u002Fp>\n        <span style=\"margin-top:auto;align-self:flex-start;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#111110;border:1.5px solid #111110;padding:7px 10px\">→ YOUR OPERATION, UPGRADED<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;padding:20px 20px 22px;min-width:0\" style-hover=\"background:#FAFAF7\">\n        <span style=\"font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#1E39D4;font-weight:700\">THE SEAT<\u002Fspan>\n        <h3 style=\"margin:10px 0 0;font-weight:900;font-stretch:112%;font-size:clamp(19px,2.4vw,23px);letter-spacing:-0.015em;text-transform:uppercase\">Fractional Founder/CPO<\u002Fh3>\n        <p style=\"font-size:14px;color:#111110;font-weight:600;margin:10px 0 0\">When you need the experience at the table between you, agents, agencies, and the challenges of launching great products and projects.<\u002Fp>\n        <p style=\"font-size:14px;color:#3E3D39;margin:8px 0 18px\">Are your agents or your agency driving you mental? Already have a product in market and growing it? Reserve me for a seat at the table for a defined stretch. I sit between you, your team, your vendors, and your ventures, get the product right, then hand it back. We all play great.<\u002Fp>\n        <span style=\"margin-top:auto;align-self:flex-start;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#111110;border:1.5px solid #111110;padding:7px 10px\">→ A SENIOR HAND TO HELP<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"How it works\" data-reveal=\"true\" style=\"margin-top:clamp(44px,7vw,72px)\">\n    <div style=\"border-top:3px solid #111110;padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\">\n      <h2 style=\"margin:0;font-weight:900;font-stretch:118%;font-size:clamp(24px,3.6vw,34px);letter-spacing:-0.02em;text-transform:uppercase\">How it works<\u002Fh2>\n      <span style=\"font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.2em;color:#8A887F\">THE PUNCH LIST<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"color:#3E3D39;font-size:15px;max-width:60ch;margin:12px 0 30px\">A clear pipeline with no mystery. You always know where you are and what happens next.<\u002Fp>\n\n    <ul style=\"list-style:none;margin:0;padding:0\">\n      <li style=\"display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:15px 0;border-top:1px solid #111110\">\n        <span aria-hidden=\"true\" style=\"width:15px;height:15px;flex:0 0 15px;background:#1E39D4;border:2px solid #1E39D4;position:relative;top:2px;color:#fff;font-size:11px;line-height:13px;text-align:center;font-family:'Space Mono',monospace\">✕<\u002Fspan>\n        <div style=\"flex:1 1 320px\"><h3 style=\"margin:0;display:inline;font-weight:800;font-size:16.5px;letter-spacing:-0.01em\">Reach out.<\u002Fh3> <p style=\"display:inline;color:#3E3D39;font-size:14px\">Tell us what you want to make. A few sentences is enough to start.<\u002Fp><\u002Fdiv>\n        <span style=\"font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:#8A887F;white-space:nowrap\">2 MIN<\u002Fspan>\n      <\u002Fli>\n      <li style=\"display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:15px 0;border-top:1px solid #111110\">\n        <span aria-hidden=\"true\" style=\"width:15px;height:15px;flex:0 0 15px;background:#1E39D4;border:2px solid #1E39D4;position:relative;top:2px;color:#fff;font-size:11px;line-height:13px;text-align:center;font-family:'Space Mono',monospace\">✕<\u002Fspan>\n        <div style=\"flex:1 1 320px\"><h3 style=\"margin:0;display:inline;font-weight:800;font-size:16.5px;letter-spacing:-0.01em\">The vet call.<\u002Fh3> <p style=\"display:inline;color:#3E3D39;font-size:14px\">Thirty minutes, free. We ask hard questions, you should too. We find out fast if this is real.<\u002Fp><\u002Fdiv>\n        <span style=\"font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:#FF4D00;font-weight:700;white-space:nowrap\">FREE · 30 MIN<\u002Fspan>\n      <\u002Fli>\n      <li style=\"display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:15px 0;border-top:1px solid #111110\">\n        <span aria-hidden=\"true\" style=\"width:15px;height:15px;flex:0 0 15px;border:2px solid #111110;position:relative;top:2px\"><\u002Fspan>\n        <div style=\"flex:1 1 320px\"><h3 style=\"margin:0;display:inline;font-weight:800;font-size:16.5px;letter-spacing:-0.01em\">Mutual decision.<\u002Fh3> <p style=\"display:inline;color:#3E3D39;font-size:14px\">We both decide. We only take projects we believe in, and you should only hire people who do.<\u002Fp><\u002Fdiv>\n        <span style=\"font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:#8A887F;white-space:nowrap\">GO / NO GO<\u002Fspan>\n      <\u002Fli>\n      <li \">A citizen inflation tracker and personal tool. <b style=\"color:#111110\">In development!<\u002Fb><\u002Fspan>\n        <span style=\"padding:14px 0;border-bottom:1px solid #111110\"><span style=\"font-family:'Space Mono',monospace;font-weight:700;font-size:10px;letter-spacing:0.12em;white-space:nowrap;display:inline-block;padding:4px 9px;border:2px solid #8A887F;color:#8A887F;transform:rotate(-2deg)\">IN DEV<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:contents\">\n        <span style=\"font-weight:800;font-size:16px;padding:14px 0;border-bottom:1px solid #111110;max-width:220px\">Creating New Convention Category<\u002Fspan>\n        <span style=\"color:#3E3D39;font-size:14.5px;padding:14px 0;border-bottom:1px solid #111110\">Working with 2 creative founders to do diligence, strategy, biz plan, branding, and early comms for an exciting new take on an annual event. <b style=\"color:#111110\">The Venture, in motion.<\u002Fb><\u002Fspan>\n        <span style=\"padding:14px 0;border-bottom:1px solid #111110\"><span style=\"font-family:'Space Mono',monospace;font-weight:700;font-size:10px;letter-spacing:0.12em;white-space:nowrap;display:inline-block;padding:4px 9px;border:2px solid #FF4D00;color:#FF4D00;transform:rotate(-2deg)\">CLIENT · IN BUILD<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Letter\" data-reveal=\"true\" style=\"background:#1E39D4;color:#fff;margin-top:clamp(44px,7vw,72px);padding:clamp(30px,5.5vw,54px) clamp(20px,4vw,48px)\">\n    <div style=\"max-width:640px;margin:0 auto\">\n      <div style=\"font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.24em;text-transform:uppercase;color:rgba(255,255,255,0.65);border-bottom:1px solid rgba(255,255,255,0.35);padding-bottom:12px;margin-bottom:24px\">RE: SEVENTEEN YEARS · FROM THE DESK OF ITSY BITSY MEDIA<\u002Fdiv>\n      <p style=\"font-size:clamp(15px,2vw,17px);line-height:1.65;color:rgba(255,255,255,0.92);margin:0 0 16px\">Itsy Bitsy Media has been my studio since 2009, in the midst of a long career in product development and media. It has carried me through a myriad of projects: standalone product development and delivery, professional media production across film, web, and TV, consulting, and a front-row seat to every cycle of the web, from SaaS to broadband, web 2, web 3, and yes, even NFTs. We've seen and done it all here in our little Itsy Bitsy outfit.<\u002Fp>\n      <p style=\"font-size:clamp(15px,2vw,17px);line-height:1.65;color:rgba(255,255,255,0.92);margin:0 0 16px\">The last year+ of advancement in AI tooling has changed <b style=\"color:#fff;font-weight:800\">everything and nothing<\u002Fb>. Nothing replaces the experience of building product, working with founders and creators, taste, business intelligence. Everything has changed in how we can now leverage all of it, in ways wide and deep I never imagined. Quickly.<\u002Fp>\n      <p style=\"font-size:clamp(15px,2vw,17px);line-height:1.65;color:rgba(255,255,255,0.92);margin:0 0 16px\">So naturally, we don't pivot, we expand. All of the expertise, zero sacrifice on quality, delivered in far more rapid and cost-efficient full-body solutions. For you. <b style=\"color:#fff;font-weight:800\">Idea to real.<\u002Fb><\u002Fp>\n      <p style=\"font-weight:900;font-stretch:115%;font-size:clamp(22px,3.4vw,30px);text-transform:uppercase;letter-spacing:-0.01em;color:#fff;margin:26px 0 10px\">Join us.<\u002Fp>\n      <p style=\"font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.8);margin:0\">Jeff Caldwell<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"CTA\" data-reveal=\"true\" style=\"padding:clamp(48px,8vw,80px) 0 0;text-align:center\">\n    <p style=\"margin:0;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#FF4D00;font-weight:700\">NOW TAKING ON NEW PROJECTS<\u002Fp>\n    <h2 style=\"margin:14px 0 0;font-weight:900;font-stretch:120%;font-size:clamp(30px,5.6vw,54px);letter-spacing:-0.025em;line-height:0.95;text-transform:uppercase\">Got the idea?<br>Let's find out if it's real.<\u002Fh2>\n    <p style=\"margin:16px 0 0;font-size:15px;color:#3E3D39\">The vet call is free and the hard caps are real.<\u002Fp>\n    <a href=\"mailto:jeff@itsybitsymedia.com\" style=\"display:inline-block;margin-top:26px;font-family:'Space Mono',monospace;font-weight:700;font-size:14px;letter-spacing:0.06em;color:#fff;background:#111110;text-decoration:none;padding:16px 30px;box-shadow:5px 5px 0 #1E39D4;transition:box-shadow 0.12s,transform 0.12s\" style-hover=\"transform:translate(2px,2px);box-shadow:3px 3px 0 #1E39D4;color:#fff\">jeff@itsybitsymedia.com<\u002Fa>\n  <\u002Fsection>\n\n  <footer style=\"margin-top:clamp(40px,6vw,60px);border-top:3px solid #111110;padding:14px 0 26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A887F\">\n    <span>© 2026 ITSY BITSY MEDIA · IDEA TO REAL<\u002Fspan>\n    <a href=\"https://www.linkedin.com/in/caldwellajeff/\" target=\"_blank\" rel=\"noopener\" style=\"color:#8A887F\">FOLLOW ALONG ON LINKEDIN<\u002Fa>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n  componentDidMount() {\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const els = document.querySelectorAll('[data-reveal]');\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) {\n          e.target.style.animation = 'ibm-pop 0.55s cubic-bezier(0.2,0.7,0.2,1) both';\n          io.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.08 });\n    els.forEach(el => io.observe(el));\n  }\
